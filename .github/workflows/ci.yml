# Builds and tests every push and pull request. Nothing is published here --
# release.yml runs the same build.yml on a v* tag and attaches its artifacts.
#
# Tags are excluded so a tag push does not build twice.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      circuitpython_repo:
        description: CircuitPython fork carrying the Rust natmod linker patches
        required: false
      circuitpython_ref:
        description: Ref within that fork
        required: false
      hal_ref:
        description: Ref of lrxxxx-hal to build against
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      circuitpython_repo: ${{ inputs.circuitpython_repo || 'fede2cr/circuitpython' }}
      circuitpython_ref: ${{ inputs.circuitpython_ref || 'cpy-rust' }}
      hal_ref: ${{ inputs.hal_ref || 'main' }}
